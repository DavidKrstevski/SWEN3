services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  api:
    build:
      context: "./Paperless API"
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=paperless;Username=paperless;Password=paperless
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Queue: ocr_jobs
      Minio__Endpoint: http://minio:9000
      Minio__AccessKey: minioadmin
      Minio__SecretKey: minioadmin
      Minio__Bucket: documents
    depends_on:
      - db
    ports:
      - "8080:8080"

  ui:
    build:
      context: "./Paperless UI"
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   
      - "9001:9001"   
    volumes:
      - minio_data:/data

  ocrworker:
    build:
      context: ./Paperless_OCRWorker
      dockerfile: Dockerfile
    depends_on:
      - rabbitmq
    environment:
      RabbitMQ__Host: rabbitmq

  genai-worker:
    build:
      context: "./Paperless AI"
      dockerfile: "./Paperless AI/Dockerfile"
    restart: always
    depends_on:
      - rabbitmq
      - minio
    environment:
      GEMINI_API_KEY: AIzaSyBFLLwgPGliR6ymzS66y94_j03TM91Rhjg
      GEMINI_MODEL: gemini-2.5-flash

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_OCR_COMPLETED_QUEUE: ocr_completed

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
      MINIO_SUMMARY_PREFIX: summaries/

  indexing-worker:
    build:
      context: "./Indexing Worker"
      dockerfile: "Indexing Worker/Dockerfile"
    depends_on:
      - rabbitmq
      - elasticsearch
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: guest
      RabbitMQ__Pass: guest
      RabbitMQ__Queue: ocr_completed_index
      Elasticsearch__Url: http://elasticsearch:9200
      Elasticsearch__IndexName: documents

  accessbatch:
    build:
      context: .
      dockerfile: Paperless_AccessBatch/Dockerfile
    depends_on:
      - db
    environment:
      AccessBatch__InputFolder: data/access-input
      AccessBatch__ArchiveFolder: data/access-archive
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=paperless;Username=paperless;Password=paperless
    volumes:
      - ./Paperless_AccessBatch/data:/app/data

volumes:
  pgdata:
  rabbitmq_data:
  minio_data:
  esdata: